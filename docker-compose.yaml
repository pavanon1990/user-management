services:
  mongo:
    image: mongo:7
    ports: 
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: user
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SECRET_KEY: "4b949ea1-ac99-4eb4-b158-f7ae46d6fc89"
      MONGO_URI: "mongodb://{user}:{password}@{host}:{port}/?authSource=admin"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USER: admin
      MONGO_PASSWORD: secret123
      MONGO_MINPOOL_SIZE: "3"
      MONGO_MAXPOOL_SIZE: "30"
      MONGO_MAX_IDLE_TIME: "30s"
      MONGO_CONNECT_TIMEOUT: "10s"
      APP_PORT: "8080"
      TOKEN_TTL: "24h"
    depends_on:
      - mongo

volumes:
  mongo_data: